<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #e0f2fe;
            color: #7c3aed;
            padding: 60px 20px;
        }

        .card {
            max-width: 600px;
            margin: auto;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 16px #0001;
        }

        h1 { color: #2563eb; }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to My Static Website!</h1>
        <p>Hello! I'm Niya Sree. This is my first Website</p>
        <p>This website is hosted for free using GitHub Pages.</p>
        <a href="https://github.com/">Visit GitHub</a>
    </div>
</body>
</html>
